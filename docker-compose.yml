services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currytest_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
      - /var/www/node_modules
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
    depends_on:
      - queue

  web:
    image: nginx:alpine
    container_name: currytest_web
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app

  queue:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: currytest_queue
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - /var/www/vendor
    command: php artisan queue:listen --tries=1
    depends_on: []

  vite:
    image: node:22-alpine
    container_name: currytest_vite
    restart: unless-stopped
    working_dir: /var/www
    ports:
      - "5173:5173"
    volumes:
      - .:/var/www
      - /var/www/node_modules
    command: npm run dev -- --host
    profiles:
      - dev
